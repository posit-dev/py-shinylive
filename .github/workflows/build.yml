name: Build and test

on:
  workflow_dispatch:
  push:
    branches: ["main", "rc-*"]
  pull_request:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out the code
        uses: actions/checkout@v6

      # `setup-uv` stopped publishing floating major tags after v7.6, so this
      # is pinned to an exact release and needs bumping by hand.
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 📦 Install dependencies
        id: install
        run: |
          uv sync

      # tox builds the wheel once and tests it on Python 3.10 to 3.14 in
      # parallel. tox-uv downloads the Python versions as needed.
      - name: 🧪 Run tests on all Python versions
        run: |
          make test-all

      - name: 📐 Check types, style, and formatting
        if: steps.install.outcome == 'success' && (success() || failure())
        run: |
          make check

  deploy:
    name: "Deploy to PyPI"
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [check]
    steps:
      - name: 📥 Check out the code
        uses: actions/checkout@v6
      - name: 🚀 Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"
      - name: 📦 Install dependencies
        run: |
          uv sync
      - name: 🧳 Build package
        run: |
          make dist
      - name: 🧪 Run tests
        run: |
          make test
      - name: 📐 Check types, style, and formatting
        run: |
          make check

      # test deploy ----
      - name: 🧪 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.event.release.name, 'TEST')
        with:
          user: __token__
          password: ${{ secrets.PYPI_TEST_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/

      ## prod deploy ----
      - name: 🚢 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.event.release.name, 'shinylive')
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

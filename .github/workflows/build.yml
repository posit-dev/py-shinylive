name: Build and test

on:
  workflow_dispatch:
  push:
    branches: ["main", "rc-*"]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # "3.10" must be a string; otherwise it is interpreted as 3.1.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    # `make install` replaces the editable install with the built wheel.
    # Without UV_NO_SYNC, each `uv run` would put the editable install back,
    # and the tests would not run against the wheel.
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v6

      # `setup-uv` stopped publishing floating major tags after v7.6, so this
      # is pinned to an exact release and needs bumping by hand.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync

      - name: Install
        id: install
        run: |
          make install

      - name: Run unit tests
        if: steps.install.outcome == 'success' && (success() || failure())
        run: |
          make test

      - name: pyrefly and ruff
        if: steps.install.outcome == 'success' && (success() || failure())
        run: |
          make check

  deploy:
    name: "Deploy to PyPI"
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - name: "Set up uv and Python"
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          uv sync
      - name: "Build Package"
        run: |
          make dist
      - name: Run unit tests
        run: |
          make test
      - name: pyrefly and ruff
        run: |
          make check

      # test deploy ----
      - name: "Test Deploy to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.event.release.name, 'TEST')
        with:
          user: __token__
          password: ${{ secrets.PYPI_TEST_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/

      ## prod deploy ----
      - name: "Deploy to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.event.release.name, 'shinylive')
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

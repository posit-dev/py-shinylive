# Smoke test for the reusable `deploy-app` workflow.
#
# Exports the small app in `tests/app/` using this branch's copy of
# `deploy-app.yaml`, so changes to that workflow are exercised before the
# `actions-v1` tag is moved onto them.
#
# This only ever triggers on pull requests, where `github.ref` is
# `refs/pull/N/merge`. The upload/deploy steps in `deploy-app.yaml` are gated on
# `refs/heads/main`, so this builds the site without publishing anything to this
# repository's GitHub Pages.

name: Test deploy-app workflow

on:
  pull_request:

jobs:
  deploy-app:
    uses: ./.github/workflows/deploy-app.yaml
    with:
      app-dir: tests/app
      # Build shinylive from this checkout rather than pulling it from PyPI.
      shinylive-version: "."
      # Not the default (""), so the `uv-version` passthrough is exercised too.
      uv-version: "latest"

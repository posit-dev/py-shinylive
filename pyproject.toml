[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinylive"
dynamic = ["version"]
authors = [
    {name = "Winston Chang", email = "winston@posit.co"},
]
description = "Run Shiny applications running Python in the browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "shiny",
    "click>=8.1.7",
    "appdirs>=1.4.4",
    "lzstring>=1.0.4",
    "typing-extensions>=4.0.1",
    "setuptools; python_version>='3.12'",
    "chevron>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/posit-dev/py-shinylive"
"Bug Tracker" = "https://github.com/posit-dev/py-shinylive/issues"
Documentation = "https://github.com/posit-dev/py-shinylive"
"Source Code" = "https://github.com/posit-dev/py-shinylive"
Changelog = "https://github.com/posit-dev/py-shinylive/blob/main/CHANGELOG.md"

[project.scripts]
shinylive = "shinylive._main:main"

# `uv sync` and `uv run` install the `dev` group by default.
[dependency-groups]
dev = [
    "pytest>=6.2.4",
    "coverage",
    "ruff>=0.6.0",
    "pyrefly>=1.5.0",
    "types-chevron>=0.14.2.20260408",
    "tox>=4.22",
    "tox-uv>=1.0.0",
]

[tool.hatch.version]
path = "shinylive/_version/__init__.py"
pattern = "SHINYLIVE_PACKAGE_VERSION\\s*=\\s*['\"](?P<version>[^'\"]+)['\"]"

# `shinylive/py.typed` ships because it is inside the package.
[tool.hatch.build.targets.wheel]
packages = ["shinylive"]

# Tests and the changelog are included so packagers (e.g. conda-forge) can
# run the tests from the sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "shinylive",
    "tests",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# `ruff format` keeps code within 88 characters; long strings and comments
# are left as they are.
ignore = ["E501"]

[tool.pyrefly]
infer-with-first-use = false
project-excludes = [
    # A fixture Shiny app for the deploy-app workflow. It imports packages that
    # are not dependencies of this repo and is never run here.
    "tests/app",
    "build",
    "dist",
    "_dev",
    ".context",
]

[tool.pyrefly.errors]
unused-ignore = "error"
implicit-any = "error"

# `make test-all` (and CI) runs the tests on every supported Python version.
# tox-uv lets uv download any missing Python versions.
[tool.tox]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = ["dev"]
# With pytest's default import mode, the repo root is put first on `sys.path`
# and the tests import `shinylive/` from the source folder. `importlib` mode
# leaves `sys.path` alone, so the tests run against the installed wheel.
commands = [["pytest", "--import-mode=importlib", { replace = "posargs", extend = true }]]
